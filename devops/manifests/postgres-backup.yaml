# Nightly Postgres dump, with an offsite copy when R2 is configured.
#
# This file exists because the CronJob did not. It was applied to the cluster once
# and lived nowhere else, which means `kind delete cluster` would have taken the
# backup job down with the data it was supposed to protect.
#
# Four changes from what was running, all of them from one night's evidence:
# two pods on 8 Nov died with `could not translate host name "postgres"`, 19 and 29
# seconds after the node container started. See the comments at each change.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: runcoach
  labels:
    app.kubernetes.io/part-of: runcoach
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Kolkata

  # Explicit, because the default is surprising and this cluster depends on it.
  #
  # 03:00 IST is 21:30 UTC, and on a laptop that is asleep at 21:30 the schedule
  # never fires at the time written here. Every run so far has actually been a
  # *catch-up*: the controller notices the missed schedule when the machine wakes
  # and runs it immediately — 8 Nov at 06:10 UTC, 12 Nov at 07:02 UTC.
  #
  # Two hours is the window in which a missed run is still worth doing. Longer, and
  # a machine woken at lunchtime fires a backup for a schedule half a day stale;
  # unset, the controller allows 100 missed schedules, which is its own surprise.
  startingDeadlineSeconds: 7200

  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800

      # Was 2, which is three attempts, and the run on 8 Nov used all three. The
      # third succeeded 31 seconds after the first failed; one more unlucky second
      # and the night's backup would simply not exist. A retry budget that is
      # exactly as large as the worst case observed is not a budget.
      backoffLimit: 4

      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

          initContainers:
            - name: dump
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - |
                  set -eu -o pipefail

                  # Wait for the database to be resolvable and accepting
                  # connections before touching it.
                  #
                  # This is the fix for the 8 Nov failures. Because the schedule is
                  # always caught up at boot, this job starts seconds after the node
                  # does, and it races CoreDNS every single time. pg_dump's response
                  # to a resolver that is not up yet is to exit — the error is
                  # "Try again", which is a temporary failure asking to be retried,
                  # and pg_dump does not retry it.
                  #
                  # Two minutes of patience turns a race into a wait.
                  for attempt in $(seq 1 60); do
                    if pg_isready -q; then break; fi
                    echo "waiting for $PGHOST to answer ($attempt/60)"
                    sleep 2
                  done
                  if ! pg_isready -q; then
                    echo "database unreachable after two minutes; giving up" >&2
                    exit 1
                  fi

                  f="/backups/runcoach-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  pg_dump --no-owner --no-privileges | gzip -9 > "$f.part"
                  mv "$f.part" "$f"
                  echo "wrote $f ($(du -h "$f" | cut -f1))"

                  # Keep the newest 14 dumps, whatever their age.
                  #
                  # The old rule deleted anything older than 13 days, which assumes
                  # a backup every night. This machine does not run every night, and
                  # the rule had already deleted the 23 Oct dump, leaving exactly two
                  # files on disk. An age rule on an irregular cadence eventually
                  # deletes the only copy there is; a count rule cannot.
                  ls -1t /backups/runcoach-*.sql.gz 2>/dev/null | tail -n +15 |
                    while read -r old; do
                      echo "pruning $old"
                      rm -f "$old"
                    done

                  find /backups -name '*.part' -mmin +60 -delete
              env:
                - name: PGHOST
                  value: postgres
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef: { name: runcoach-secrets, key: POSTGRES_DB }
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: runcoach-secrets, key: POSTGRES_USER }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: runcoach-secrets, key: POSTGRES_PASSWORD }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - { name: backups, mountPath: /backups }

          containers:
            - name: upload
              image: rclone/rclone:1.68
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
                    # Deliberately still a success: a local-only setup is a valid
                    # choice. But it is worth being loud about, because the dump
                    # currently lives inside the kind node and nowhere else, and a
                    # backup that dies with the thing it is backing up is a copy,
                    # not a backup.
                    echo "WARNING: secret runcoach-r2 is missing."
                    echo "WARNING: this dump exists only inside the cluster node."
                    echo "WARNING: deleting the kind cluster destroys every backup."
                    exit 0
                  fi
                  export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
                  latest="$(ls -1t /backups/runcoach-*.sql.gz | head -n1)"
                  rclone copyto "$latest" "r2:${R2_BUCKET}/$(basename "$latest")"
                  echo "uploaded $(basename "$latest")"
              env:
                - name: HOME
                  value: /tmp
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef: { name: runcoach-r2, key: R2_ACCOUNT_ID, optional: true }
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef: { name: runcoach-r2, key: R2_BUCKET, optional: true }
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: runcoach-r2, key: R2_ACCESS_KEY_ID, optional: true }
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: runcoach-r2, key: R2_SECRET_ACCESS_KEY, optional: true }
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - { name: backups, mountPath: /backups, readOnly: true }
                - { name: tmp, mountPath: /tmp }

          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
            - name: tmp
              emptyDir: {}
