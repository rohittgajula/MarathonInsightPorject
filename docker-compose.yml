name: runproject

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-runproject}
      POSTGRES_USER: ${POSTGRES_USER:-runproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runproject}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-runproject}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DATABASE_URL: postgres://${POSTGRES_USER:-runproject}:${POSTGRES_PASSWORD:-runproject}@db:5432/${POSTGRES_DB:-runproject}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      GARMIN_TOKEN_ROOT: /data/garmin_tokens
      # Both optional. With neither set, daily logs fall back to the keyword
      # extractor and the app says so rather than failing.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # anthropic | gemini. Unset, whichever key is present is used.
      LOG_AI_PROVIDER: ${LOG_AI_PROVIDER:-}
    volumes:
      - ./backend:/app
      - media:/data/media
      - ${GARMIN_TOKEN_DIR:-~/Library/Caches/garmin-mcp/garth}:/data/garmin_tokens/athlete_1:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    environment: *backend_env
    volumes:
      - ./backend:/app
      - media:/data/media
      - ${GARMIN_TOKEN_DIR:-~/Library/Caches/garmin-mcp/garth}:/data/garmin_tokens/athlete_1:ro
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *backend_env
    volumes:
      - ./backend:/app
      - media:/data/media
      - ${GARMIN_TOKEN_DIR:-~/Library/Caches/garmin-mcp/garth}:/data/garmin_tokens/athlete_1:ro
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
